name: Platform checks

on:
  push:
    branches: [dev]
    paths: ['Cargo.toml', 'Cargo.lock', 'crates/**', 'apps/**', 'native/**', 'packaging/**', '.github/workflows/platform-checks.yml']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      build_previews:
        description: Build macOS ARM64, Ubuntu and Flatpak development artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2

jobs:
  obs-macos:
    name: Apple Silicon OBS bridge
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Prepare the verified native capture runtime
        run: |
          brew install cmake pkg-config ffmpeg
          python3 native/obs/prepare-macos.py
      - name: Exercise native encoding and replay without capturing user content
        run: |
          export ENCORE_NATIVE_RUNTIME="$PWD/tools/obs-runtime"
          cargo run --locked -p encore-recorder -- --self-test target/native-self-test
          ffmpeg -v error -i target/native-self-test/encore-self-test.mp4 -map 0 -f null -
          python3 native/obs/verify-self-test.py target/native-self-test/encore-self-test.mp4
      - name: Package the native Apple Silicon development app
        run: |
          python3 apps/ui/scripts/prepare-macos-ffmpeg.py
          npm --prefix apps/ui ci
          npm --prefix apps/ui run build:preview
          target/release/bundle/macos/Encore.app/Contents/Resources/ffmpeg -version
          codesign --verify --deep --strict target/release/bundle/macos/Encore.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encore-obs-bridge-apple-silicon-dev
          path: |
            tools/obs-runtime/lib/libencore_capture.dylib
            target/native-self-test/*
            target/release/bundle/dmg/*.dmg
          retention-days: 14

  obs-linux:
    name: Linux OBS bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config g++ libobs-dev obs-studio ffmpeg libavformat-dev libavcodec-dev libavutil-dev libgtk-3-dev libwayland-dev libayatana-appindicator3-dev libpipewire-0.3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev xvfb
      - name: Compile capture and mux bridge
        run: |
          python3 native/obs/prepare-linux.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Exercise the complete native encoder and replay pipeline
        run: |
          export ENCORE_NATIVE_RUNTIME="$PWD/tools/obs-runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a cargo run --locked -p encore-recorder -- --self-test target/native-self-test
          ffmpeg -v error -i target/native-self-test/encore-self-test.mp4 -map 0 -f null -
          python3 native/obs/verify-self-test.py target/native-self-test/encore-self-test.mp4
      - name: Package the native Ubuntu development app
        run: |
          npm --prefix apps/ui ci
          npm --prefix apps/ui run build:preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encore-obs-bridge-linux-dev
          path: |
            tools/obs-runtime/lib/libencore_capture.so
            target/native-self-test/*
            target/release/bundle/deb/*.deb
          retention-days: 14

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows regression
            os: windows-2022
          - name: Apple Silicon
            os: macos-15
          - name: Ubuntu 24.04 x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libxdo-dev ffmpeg gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Prepare Apple Silicon FFmpeg
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ffmpeg
          python3 apps/ui/scripts/prepare-macos-ffmpeg.py
      - name: Prepare Windows FFmpeg and recorder resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          New-Item -ItemType Directory -Force tools | Out-Null
          $ffmpegBinary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegBinary) { throw 'FFmpeg executable not found' }
          Copy-Item -LiteralPath $ffmpegBinary.FullName -Destination tools/ffmpeg.exe
          cargo build --locked --release -p encore-recorder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm --prefix apps/ui ci
      - run: npm --prefix apps/ui run build
      - run: npm --prefix apps/ui run test:updates
      - name: Check the entire native workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test replay, media processing, and configuration
        run: cargo test --locked -p encore-common -p encore-encode -p encore-clipstore -p encore-editor
      - name: Test library backend
        run: cargo test --locked -p encore-ui --lib
      - name: Build development packages
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os != 'Windows'
        run: npm --prefix apps/ui run build:preview
      - name: Check bundled macOS FFmpeg
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os == 'macOS'
        run: |
          file target/release/bundle/macos/Encore.app/Contents/MacOS/encore-ui
          target/release/bundle/macos/Encore.app/Contents/Resources/ffmpeg -version
      - name: Build Flatpak development bundle
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          bash packaging/flatpak/build.sh
          flatpak install --user -y target/Encore-linux-x86_64-dev.flatpak
          flatpak run --command=ffmpeg com.encore.clipper -version
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os != 'Windows'
        with:
          name: encore-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/*-dev.flatpak
          if-no-files-found: error
          retention-days: 14
