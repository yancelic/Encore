name: Platform checks

on:
  push:
    branches: [dev]
    tags: ['v*-beta.*']
    paths: ['Cargo.toml', 'Cargo.lock', 'README.md', 'docs/**', 'crates/**', 'apps/**', 'native/**', 'packaging/**', '.github/workflows/platform-checks.yml']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      build_previews:
        description: Build macOS ARM64, Ubuntu and Flatpak development artifacts
        type: boolean
        default: false
      linux_artifact_run_id:
        description: Test only Flatpak using a verified Ubuntu artifact from this run (Rust/UI sources must match)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  # Finish a dev publication before starting another update of the beta channel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2

jobs:
  release-version:
    name: Plan beta package version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Test beta version preparation
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Plan package version and publication channel
        id: version
        run: python3 packaging/beta_release.py plan >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak native runtime
    if: ${{ !cancelled() && (needs.obs-linux.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != '')) }}
    needs: [release-version, obs-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify reused Ubuntu executables match the current source
        if: github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.linux_artifact_run_id }}
        run: |
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          package_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq .head_sha)
          git fetch --no-tags origin "$package_sha"
          git diff --exit-code "$package_sha" HEAD -- Cargo.toml Cargo.lock crates apps
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Linux OBS bridge" and .conclusion == "success") | .id' \
            | grep -E '^[0-9]+$'
      - uses: actions/download-artifact@v4
        with:
          name: encore-obs-bridge-linux-dev
          path: target/debian-artifact
          run-id: ${{ inputs.linux_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare native executables from the verified Ubuntu package
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ffmpeg xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          mkdir -p target/debian-extract target/release
          dpkg-deb -x target/debian-artifact/target/release/bundle/deb/*.deb target/debian-extract
          cp target/debian-extract/usr/bin/encore-ui target/release/encore-ui
          find target/debian-extract -type f -name encore-recorder -exec cp '{}' target/release/encore-recorder \;
      - uses: actions/cache/restore@v4
        id: flatpak-cache
        with:
          path: .flatpak-builder
          key: flatpak-native-${{ runner.os }}-${{ hashFiles('packaging/flatpak/*.json', 'packaging/flatpak/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            flatpak-native-${{ runner.os }}-${{ hashFiles('packaging/flatpak/*.json', 'packaging/flatpak/*.cmake') }}-
            flatpak-native-${{ runner.os }}-
      - name: Build and install the Flatpak development bundle
        run: |
          bash packaging/flatpak/build.sh
          flatpak install --user -y target/Encore-linux-x86_64-dev.flatpak
      - name: Verify native replay inside the Flatpak sandbox
        run: bash packaging/flatpak/test.sh
      - uses: actions/cache/save@v4
        if: always() && steps.flatpak-cache.outputs.cache-primary-key != ''
        with:
          path: .flatpak-builder
          key: ${{ steps.flatpak-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: encore-flatpak-linux-dev
          path: target/Encore-linux-x86_64-dev.flatpak
          retention-days: 14

  obs-macos:
    name: Apple Silicon OBS bridge
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != '') }}
    needs: release-version
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Geometry/replay checks run on Apple's software renderer in a VM.
      # Real-device hardware encoder validation remains a separate test.
      ENCORE_SELF_TEST_ENCODER: obs_x264
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set beta package version
        env:
          ENCORE_BETA_VERSION: ${{ needs.release-version.outputs.version }}
        run: python packaging/beta_release.py apply
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Prepare the verified native capture runtime
        run: |
          brew install cmake pkg-config ffmpeg
          python3 native/obs/prepare-macos.py
      - name: Exercise native encoding and replay without capturing user content
        run: |
          export ENCORE_NATIVE_RUNTIME="$PWD/tools/obs-runtime"
          cargo run --locked -p encore-recorder -- --self-test target/native-self-test
          ffmpeg -v error -i target/native-self-test/encore-self-test.mp4 -map 0 -f null -
          python3 native/obs/verify-self-test.py target/native-self-test/encore-self-test.mp4
      - name: Package the native Apple Silicon development app
        run: |
          rm -rf -- target/release/bundle
          python3 apps/ui/scripts/prepare-macos-ffmpeg.py
          npm --prefix apps/ui ci
          npm --prefix apps/ui run build:preview
          target/release/bundle/macos/Encore.app/Contents/Resources/ffmpeg -version
          codesign --verify --deep --strict target/release/bundle/macos/Encore.app
          python3 native/obs/verify-package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encore-obs-bridge-apple-silicon-dev
          path: |
            tools/obs-runtime/lib/libencore_capture.dylib
            target/native-idle-sample.txt
            target/native-self-test/*
            target/release/bundle/dmg/*.dmg
          retention-days: 14

  obs-linux:
    name: Linux OBS bridge
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != '') }}
    needs: release-version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set beta package version
        env:
          ENCORE_BETA_VERSION: ${{ needs.release-version.outputs.version }}
        run: python packaging/beta_release.py apply
      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config g++ libobs-dev obs-studio ffmpeg libavformat-dev libavcodec-dev libavutil-dev libgtk-3-dev libwayland-dev libayatana-appindicator3-dev libpipewire-0.3-dev libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev xvfb openbox x11-utils dbus-x11
      - name: Compile capture and mux bridge
        run: |
          python3 native/obs/prepare-linux.py
          ctest --test-dir target/native-obs-linux/bridge-build --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Exercise the complete native encoder and replay pipeline
        run: |
          export ENCORE_NATIVE_RUNTIME="$PWD/tools/obs-runtime"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a cargo run --locked -p encore-recorder -- --self-test target/native-self-test
          ffmpeg -v error -i target/native-self-test/encore-self-test.mp4 -map 0 -f null -
          python3 native/obs/verify-self-test.py target/native-self-test/encore-self-test.mp4
      - name: Package the native Ubuntu development app
        run: |
          rm -rf -- target/release/bundle
          npm --prefix apps/ui ci
          npm --prefix apps/ui run build:preview
          python3 native/obs/verify-package.py
      - name: Record an actual controlled X11 window
        env:
          ENCORE_NATIVE_RUNTIME: ${{ github.workspace }}/tools/obs-runtime
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: dbus-run-session -- xvfb-run -a bash native/obs/with-test-desktop.sh bash native/obs/test-window-capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encore-obs-bridge-linux-dev
          path: |
            tools/obs-runtime/lib/libencore_capture.so
            target/native-self-test/*
            target/release/bundle/deb/*.deb
            target/native-window-self-test/*
          retention-days: 14

  native:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != '') }}
    needs: release-version
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows regression
            os: windows-2022
          - name: Apple Silicon
            os: macos-15
          - name: Ubuntu 24.04 x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set beta package version
        env:
          ENCORE_BETA_VERSION: ${{ needs.release-version.outputs.version }}
        run: python packaging/beta_release.py apply
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libxdo-dev ffmpeg gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad xvfb
      - name: Prepare Apple Silicon FFmpeg
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ffmpeg
          python3 apps/ui/scripts/prepare-macos-ffmpeg.py
      - name: Prepare Windows FFmpeg and recorder resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          New-Item -ItemType Directory -Force tools | Out-Null
          $ffmpegBinary = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpegBinary) { throw 'FFmpeg executable not found' }
          Copy-Item -LiteralPath $ffmpegBinary.FullName -Destination tools/ffmpeg.exe
          cargo build --locked --release -p encore-recorder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm --prefix apps/ui ci
      - run: npm --prefix apps/ui run build
      - run: npm --prefix apps/ui run test:updates
      - name: Check the entire native workspace
        run: cargo check --locked --workspace --all-targets
      - name: Test replay, media processing, and configuration
        run: cargo test --locked -p encore-common -p encore-encode -p encore-clipstore -p encore-editor
      - name: Test library backend
        run: cargo test --locked -p encore-ui --lib
      - name: Test Windows tray startup and Explorer recovery
        if: runner.os == 'Windows'
        run: cargo test --locked -p encore-recorder tray -- --test-threads=1
      - name: Verify native Linux file clipboard formats
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked -p encore-ui --lib linux_clipboard_exchanges_file_mime_types -- --ignored --test-threads=1
      - name: Build development packages
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os != 'Windows'
        run: npm --prefix apps/ui run build:preview
      - name: Check bundled macOS FFmpeg
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os == 'macOS'
        run: |
          file target/release/bundle/macos/Encore.app/Contents/MacOS/encore-ui
          target/release/bundle/macos/Encore.app/Contents/Resources/ffmpeg -version
      - name: Build Flatpak development bundle
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          bash packaging/flatpak/build.sh
          flatpak install --user -y target/Encore-linux-x86_64-dev.flatpak
          flatpak run --command=ffmpeg com.encore.clipper -version
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_previews && runner.os != 'Windows'
        with:
          name: encore-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/*-dev.flatpak
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    name: Publish macOS and Linux beta
    if: github.event_name == 'push' && needs.release-version.outputs.tag != ''
    needs: [release-version, obs-linux, obs-macos, flatpak, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: encore-obs-bridge-linux-dev
          path: target/beta-artifact/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: encore-obs-bridge-apple-silicon-dev
          path: target/beta-artifact/macos
      - uses: actions/download-artifact@v4
        with:
          name: encore-flatpak-linux-dev
          path: target/beta-artifact/flatpak
      - name: Prepare tested packages, checksums and release notes
        env:
          ENCORE_BETA_VERSION: ${{ needs.release-version.outputs.version }}
        run: python3 packaging/beta_release.py prepare
      - name: Publish a prerelease with the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENCORE_BETA_TAG: ${{ needs.release-version.outputs.tag }}
          ENCORE_BETA_VERSION: ${{ needs.release-version.outputs.version }}
        run: python3 packaging/beta_release.py publish
