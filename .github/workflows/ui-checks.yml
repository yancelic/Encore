name: UI checks

on:
  push:
    branches: ['codex/**']
    paths: ['apps/ui/**', '.github/workflows/ui-checks.yml']
  pull_request:
    branches: [main]
    paths: ['apps/ui/**', '.github/workflows/ui-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run test:updates
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: apps/ui/test-results/
          retention-days: 7
