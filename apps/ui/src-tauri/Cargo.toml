[package]
name = "encore-ui"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Encore Game Clipping & Multi-Track Replay Studio"

[package.metadata.tauri-winres]
FileDescription = "Encore Game Clipping & Multi-Track Replay Studio"
ProductName = "Encore"
CompanyName = "Encore"
LegalCopyright = "Copyright (C) 2026 Encore Contributors (GPL-3.0)"
OriginalFilename = "encore-ui.exe"
InternalName = "encore-ui"

[lib]
name = "encore_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
encore-clipstore = { path = "../../../crates/clipstore" }
encore-common = { path = "../../../crates/common" }
encore-editor = { path = "../../../crates/editor" }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-updater = "2"

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
