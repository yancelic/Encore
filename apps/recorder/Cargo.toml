[package]
name = "encore-recorder"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Encore Background Game & Audio Replay Recorder"

[package.metadata.winres]
FileDescription = "Encore Background Game & Audio Replay Recorder"
ProductName = "Encore"
CompanyName = "Encore"
LegalCopyright = "Copyright (C) 2026 Encore Contributors (GPL-3.0)"
OriginalFilename = "encore-recorder.exe"
InternalName = "encore-recorder"

[dependencies]
encore-common = { path = "../../crates/common" }
encore-encode = { path = "../../crates/encode" }
global-hotkey = "0.10.0"
serde_json = "1.0.154"
wasapi = "0.27.0"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-capture = "2.0.1"

[build-dependencies]
tauri-winres = "0.3.7"
